name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build sur le stockage local (data/content.json) : aucune base ni secret nécessaire.
      - run: npm run build
        env:
          SITE_URL: https://manasse.dev
          NEXT_TELEMETRY_DISABLED: 1
